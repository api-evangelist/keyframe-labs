aid: keyframe-labs
name: Keyframe Labs
description: >-
  Keyframe Labs builds real-time foundation models that turn AI voice and text
  agents into lifelike, emotionally expressive video calls. Its Persona-1.5-Live
  product lets developers add photoreal AI avatars ("personas") to their agents
  and applications with a few lines of embed code, at roughly 500ms latency and
  from $0.06 per minute. The platform exposes a REST Sessions API (create a live
  session, manage meeting bots for Zoom/Meet/Teams, and list voices and LLM
  models), JavaScript/TypeScript SDKs, and embeddable UI elements, with hosted
  and self-managed integration paths that plug into agent frameworks such as
  LiveKit Agents, ElevenLabs Agents, and OpenAI Realtime. Founded in 2025 and
  backed by Y Combinator (Spring 2026), Keyframe Labs is based in San Francisco.
